name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake ninja-build libffi-dev libssl-dev clang

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade "cython<3.0" buildozer virtualenv

      - name: Build Android APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: List generated APKs
        run: |
          ls -la bin/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AOV_Checker_Android_APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest-release
          name: "AOV Checker Pro v1.0.0 (Android APK)"
          body: |
            ### 🚀 Bản Build Android APK Tự Động (AOV Checker Pro)
            - Tự động biên dịch từ mã nguồn mới nhất trên nhánh `main`.
            - Tải trực tiếp file `.apk` đính kèm bên dưới và cài đặt trên thiết bị Android của bạn.
          files: bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
